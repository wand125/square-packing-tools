[package]
name = "n17bb-verify"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Independent exact verifier for n17 interval branch-and-bound certificates"
license = "MIT"
readme = "README.md"
repository = "https://github.com/wand125/n17-bb-verifier"

[dependencies]
rug = { version = "=1.28.0", default-features = false, features = ["integer", "rational", "std"] }
gmp-mpfr-sys = { version = "=1.6.8", default-features = false, features = ["use-system-libs"] }
serde_json = "=1.0.151"
flate2 = "=1.0.24"
rayon = "=1.5.3"
sha2 = "=0.10.6"

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
warnings = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "none"
